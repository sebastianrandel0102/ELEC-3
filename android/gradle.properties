org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Limit concurrent compiler memory use on development machines.
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Firebase plugins support AGP 9's built-in Kotlin compiler.
android.builtInKotlin=true

# Kotlin incremental caches cannot relativize Pub sources on C: against this
# project on D:. Full Kotlin compilation avoids the cross-drive cache failure.
kotlin.incremental=false
