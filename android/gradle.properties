org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Firebase plugins support AGP 9's built-in Kotlin compiler.
android.builtInKotlin=true

# Kotlin incremental caches cannot relativize Pub sources on C: against this
# project on D:. Full Kotlin compilation avoids the cross-drive cache failure.
kotlin.incremental=false
